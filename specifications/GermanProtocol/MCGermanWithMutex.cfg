\* Smallest meaningful instance: two nodes (Coherence needs i # j) and two
\* distinct data values, so that writes are distinguishable and the data-integrity
\* property DataProp is exercised non-vacuously.
\*
\* Besides the safety invariants this model also checks the refinement
\* Spec => Abstract!Spec (the data-forgetting projection onto GermanCoherence,
\* defined in GermanWithMutex.tla).
CONSTANTS
  NODE = {n1, n2}
  DATA = {d1, d2}
  NoData = noData
  NoNode = noNode

SYMMETRY Symmetry

SPECIFICATION Spec

INVARIANT
  TypeOK
  Coherence
  DataProp
  ChannelWellFormed
  TransactionConsistency
  DirectoryAccurate
  ExclusiveIsolation
  WritebackCarriesLatest

PROPERTY Refinement
