\* Liveness model. Bounded through MCNext rather than a CONSTRAINT, so no
\* successor states are discarded while temporal properties are checked.

SPECIFICATION MCLiveSpec

CONSTANTS
    Nodes   = {n1, n2}
    MsgIDs  = {m1}
    MaxSlot = 1

PROPERTIES
    MCTickProgress
    EventualRejoin
    EventualAdmission
