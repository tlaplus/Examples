\* Liveness model. Bounded inside MCTick rather than by a state constraint,
\* so no successor state is discarded while temporal properties are checked.

SPECIFICATION MCLiveSpec

CONSTANTS
    Nodes   = {n1, n2}
    MsgIDs  = {m1}
    MaxSlot = 1

PROPERTIES
    MCTickProgress
    EventualRejoin
    EventualAdmission
