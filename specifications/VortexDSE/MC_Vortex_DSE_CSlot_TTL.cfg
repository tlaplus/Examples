\* Safety model for the strict (opt-in TTL) admission mode.

SPECIFICATION MCSpec

CONSTANTS
    Nodes   = {n1, n2}
    MsgIDs  = {m1, m2}
    MaxSlot = 4

INVARIANTS
    MCTypeInvariant
    ExactlyOncePerNode
    CSlotStrictAdmission
    PersistedReflectsReality
    NoPhantomProcess
    DecisionLocalityOnly
    NoLateAdmission
