\* Safety model for the agreement layer, under adversarial replay.

SPECIFICATION MCSpec

CONSTANTS
    Nodes   = {n1, n2}
    MsgIDs  = {m1, m2}
    MaxSlot = 2

INVARIANTS
    MCTypeInvariant
    ProcessedAreCurrentSlot
    CommittedIsUnion
    MerkleAgreement
    CommittedSupersetsProcessed
    NoPhantomInCommitted
    NoReorderAcrossCslot
    PhaseProgressionValid
