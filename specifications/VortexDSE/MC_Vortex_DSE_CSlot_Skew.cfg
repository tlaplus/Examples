\* Per-node clocks under bounded skew, with Byzantine slot/origin spoofing.

SPECIFICATION MCSpec

CONSTANTS
    Nodes   = {n1, n2}
    MsgIDs  = {m1}
    MaxSkew = 1
    MaxSlot = 2

INVARIANTS
    MCTypeInvariant
    BoundedSkew
    ExactlyOncePerNode
    CSlotLocalAdmission
    PersistedReflectsReality
    NoPhantomProcess
